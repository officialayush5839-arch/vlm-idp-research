<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pipeBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1120" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="blockClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="blockMod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="blockSev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="blockCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Shadow and Glow Filters -->
    <filter id="isoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatIso1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatIso2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 60; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes radarSweep {
        0% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.9; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(0.95); }
      }

      .float-box1 { animation: floatIso1 4.5s ease-in-out infinite; }
      .float-box2 { animation: floatIso2 5.5s ease-in-out infinite 0.7s; }
      .flow-pulse { animation: pulseBeam 2.4s linear infinite; stroke-dasharray: 12 8; }
      .radar-pulse { animation: radarSweep 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="380" fill="url(#pipeBg)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Background 3D Perspective Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
    <line x1="50" y1="320" x2="1050" y2="320"/>
    <line x1="120" y1="345" x2="980" y2="345"/>
    <line x1="200" y1="370" x2="900" y2="370"/>
    <line x1="550" y1="180" x2="50" y2="380"/>
    <line x1="550" y1="180" x2="300" y2="380"/>
    <line x1="550" y1="180" x2="550" y2="380"/>
    <line x1="550" y1="180" x2="800" y2="380"/>
    <line x1="550" y1="180" x2="1050" y2="380"/>
  </g>

  <!-- Section Title & Subtitle -->
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
    End-to-End Multimodal Pipeline Architecture
  </text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" font-weight="500">
    Degradation-Aware Adaptive Routing · 60% Context Pruning · Spatial Grounding · Calibrated Abstention
  </text>

  <!-- Interactive 3D Flow Connectors with Pulsing Laser Flow -->
  <g>
    <!-- From Ingestion to Router -->
    <path class="flow-pulse" d="M190,200 L270,200" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#laserGlow)"/>
    <!-- Router splits into Clean, Moderate, Severe -->
    <path class="flow-pulse" d="M370,180 L440,130" fill="none" stroke="#34d399" stroke-width="2"/>
    <path class="flow-pulse" d="M370,200 L440,200" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path class="flow-pulse" d="M370,220 L440,270" fill="none" stroke="#f43f5e" stroke-width="2"/>

    <!-- Reconverge to Retrieval & Core -->
    <path class="flow-pulse" d="M570,130 L640,180" fill="none" stroke="#34d399" stroke-width="2"/>
    <path class="flow-pulse" d="M570,200 L640,200" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path class="flow-pulse" d="M570,270 L640,220" fill="none" stroke="#f43f5e" stroke-width="2"/>

    <!-- From Core to Grounding & Gate -->
    <path class="flow-pulse" d="M750,200 L820,200" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#laserGlow)"/>
    <path class="flow-pulse" d="M920,180 L980,150" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#laserGlow)"/>
    <path class="flow-pulse" d="M920,220 L980,250" fill="none" stroke="#f43f5e" stroke-width="2"/>
  </g>

  <!-- STAGE 1: Document Ingestion Prism -->
  <g class="float-box1" transform="translate(60, 150)" filter="url(#isoShadow)">
    <rect width="130" height="100" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="8" fill="rgba(56,189,248,0.2)"/>
    <text x="25" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">1</text>
    <text x="44" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Ingestion</text>
    <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Multi-Page PDF</text>
    <text x="20" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Image Normalize</text>
    <rect x="20" y="86" width="90" height="4" rx="2" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- STAGE 2: Quality Assessment Hexagon Router -->
  <g class="float-box2" transform="translate(250, 140)" filter="url(#isoShadow)">
    <rect width="120" height="120" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(129,140,248,0.5)" stroke-width="1.8"/>
    <circle cx="60" cy="40" r="16" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1.2" class="radar-pulse"/>
    <text x="60" y="44" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#818cf8" text-anchor="middle">Q</text>
    <text x="60" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Quality Router</text>
    <text x="60" y="92" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">10 Corruptions</text>
    <text x="60" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34d399" text-anchor="middle">Learned Split</text>
  </g>

  <!-- STAGE 3: Tri-Pathway Floating Cards -->
  <!-- 3A: Clean Route -->
  <g class="float-box1" transform="translate(440, 105)" filter="url(#isoShadow)">
    <rect width="130" height="52" rx="10" fill="url(#blockClean)" stroke="#34d399" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#34d399">CLEAN ROUTE</text>
    <text x="14" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0">Direct VLM Stream</text>
  </g>
  <!-- 3B: Moderate Route -->
  <g class="float-box2" transform="translate(440, 174)" filter="url(#isoShadow)">
    <rect width="130" height="52" rx="10" fill="url(#blockMod)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#fbbf24">MODERATE ROUTE</text>
    <text x="14" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0">Wiener Enhance</text>
  </g>
  <!-- 3C: Severe Route -->
  <g class="float-box1" transform="translate(440, 244)" filter="url(#isoShadow)">
    <rect width="130" height="52" rx="10" fill="url(#blockSev)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f43f5e">SEVERE ROUTE</text>
    <text x="14" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0">OCR Fallback Link</text>
  </g>

  <!-- STAGE 4: Multimodal Context Pruning & Neural Core -->
  <g class="float-box2" transform="translate(640, 135)" filter="url(#isoShadow)">
    <rect width="135" height="130" rx="16" fill="url(#blockCore)" stroke="rgba(56,189,248,0.7)" stroke-width="2"/>
    <rect x="15" y="15" width="105" height="24" rx="6" fill="rgba(0,0,0,0.4)"/>
    <text x="67" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">INT4 NF4 VLM</text>
    <text x="67" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Neural Core</text>
    <text x="67" y="78" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86efac" text-anchor="middle">-60% Pages Fed</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">2.0x Fast Latency</text>
    <rect x="25" y="108" width="85" height="12" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="67" y="117" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">531 MB Peak</text>
  </g>

  <!-- STAGE 5: Evidence Grounding & Abstention Gate -->
  <g class="float-box1" transform="translate(820, 145)" filter="url(#isoShadow)">
    <rect width="120" height="110" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(52,211,153,0.5)" stroke-width="1.8"/>
    <circle cx="60" cy="35" r="14" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.5"/>
    <path d="M54,35 L58,39 L66,31" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Grounding &amp;</text>
    <text x="60" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Abstention</text>
    <text x="60" y="98" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#86efac" text-anchor="middle">IoU: 0.799</text>
  </g>

  <!-- FINAL OUTPUTS -->
  <!-- Output A: Verified Answer -->
  <g class="float-box2" transform="translate(970, 115)" filter="url(#isoShadow)">
    <rect width="110" height="56" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.6"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#10b981">VERIFIED</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0">89.1% Accuracy</text>
  </g>
  <!-- Output B: Abstain / Review -->
  <g class="float-box1" transform="translate(970, 220)" filter="url(#isoShadow)">
    <rect width="110" height="56" rx="10" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="1.4"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f43f5e">ABSTAIN</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0">Human Review</text>
  </g>

</svg>
