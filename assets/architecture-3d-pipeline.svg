<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="archBgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0b1325" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#060913" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Accents -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Stage Box Gradients -->
    <linearGradient id="gradIngest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="gradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="gradMod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="gradSev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="gradCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="boxDropShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="beamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>

    <!-- CSS Keyframes for Subtle Pulse ONLY (Zero transform overrides) -->
    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-line {
        animation: dashFlow 2s linear infinite;
        stroke-dasharray: 8 5;
      }
      .glowing-border {
        animation: pulseBorder 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="520" fill="url(#archBgGrad)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

  <!-- Subtle Perspective Grid (Floor) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
    <line x1="60" y1="460" x2="1140" y2="460"/>
    <line x1="120" y1="485" x2="1080" y2="485"/>
    <line x1="200" y1="508" x2="1000" y2="508"/>
    <line x1="600" y1="360" x2="60" y2="520"/>
    <line x1="600" y1="360" x2="300" y2="520"/>
    <line x1="600" y1="360" x2="600" y2="520"/>
    <line x1="600" y1="360" x2="900" y2="520"/>
    <line x1="600" y1="360" x2="1140" y2="520"/>
  </g>

  <!-- Diagram Header -->
  <g transform="translate(60, 42)">
    <rect width="210" height="24" rx="12" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">CANONICAL RESEARCH ARCHITECTURE</text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      End-to-End Multimodal Document Intelligence Pipeline
    </text>
    <text x="0" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">
      IEEE Research Framework: Degradation Assessment · Tri-Pathway Adaptive Routing · Multimodal Context Pruning · Grounded Abstention
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- CONNECTING LASER FLOW ARROWS (Absolute SVG Coordinates)                    -->
  <!-- ========================================================================= -->

  <!-- Ingestion (160) -> Quality (230) -->
  <path class="pulse-line" d="M 160 270 L 225 270" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

  <!-- Quality (350) -> Clean Route (420, 175) -->
  <path class="pulse-line" d="M 350 240 C 380 240, 390 175, 415 175" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Quality (350) -> Moderate Route (420, 270) -->
  <path class="pulse-line" d="M 350 270 L 415 270" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Quality (350) -> Severe Route (420, 365) -->
  <path class="pulse-line" d="M 350 300 C 380 300, 390 365, 415 365" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- Clean Route (555, 175) -> Retrieval & Pruning (620, 240) -->
  <path class="pulse-line" d="M 555 175 C 585 175, 595 240, 615 240" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Moderate Route (555, 270) -> Retrieval & Pruning (620, 270) -->
  <path class="pulse-line" d="M 555 270 L 615 270" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Severe Route (555, 365) -> Retrieval & Pruning (620, 300) -->
  <path class="pulse-line" d="M 555 365 C 585 365, 595 300, 615 300" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Retrieval (750) -> VLM Reasoning Core (800) -->
  <path class="pulse-line" d="M 750 270 L 795 270" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- VLM Core (920) -> Grounding & Gating (970) -->
  <path class="pulse-line" d="M 920 270 L 965 270" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Grounding & Gating (1075) -> VERIFIED (1120, 205) -->
  <path class="pulse-line" d="M 1075 240 C 1095 240, 1100 205, 1115 205" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- Grounding & Gating (1075) -> ABSTAIN (1120, 335) -->
  <path class="pulse-line" d="M 1075 300 C 1095 300, 1100 335, 1115 335" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- ========================================================================= -->
  <!-- PIPELINE STAGE CARDS (Independent Coordinates, Zero Transform Overlap)    -->
  <!-- ========================================================================= -->

  <!-- STAGE 1: DOCUMENT INGESTION -->
  <!-- Box: x=50, y=200, w=110, h=140 -->
  <g filter="url(#boxDropShadow)">
    <rect x="50" y="200" width="110" height="140" rx="14" fill="url(#gradIngest)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" class="glowing-border"/>
    <circle cx="70" cy="225" r="8" fill="rgba(56,189,248,0.2)"/>
    <text x="67" y="229" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">1</text>
    <text x="84" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Ingestion</text>
    
    <text x="62" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#cbd5e1" font-weight="600">PDF / Image</text>
    <text x="62" y="274" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94a3b8">Page Rendering</text>
    <text x="62" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94a3b8">RGB Normalize</text>
    
    <rect x="62" y="310" width="86" height="18" rx="4" fill="rgba(56,189,248,0.12)"/>
    <text x="105" y="322" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#38bdf8" text-anchor="middle">5-PAGE INPUT</text>
  </g>

  <!-- STAGE 2: QUALITY ASSESSMENT & DEGRADATION DETECTOR -->
  <!-- Box: x=230, y=190, w=120, h=160 -->
  <g filter="url(#boxDropShadow)">
    <rect x="230" y="190" width="120" height="160" rx="14" fill="url(#gradIngest)" stroke="rgba(129,140,248,0.5)" stroke-width="1.8" class="glowing-border"/>
    <circle cx="252" cy="216" r="8" fill="rgba(129,140,248,0.2)"/>
    <text x="249" y="220" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8">2</text>
    <text x="266" y="219" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Quality Engine</text>
    
    <text x="242" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">10 Feature Vector:</text>
    <text x="242" y="261" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e2e8f0">• Blur &amp; Noise</text>
    <text x="242" y="275" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e2e8f0">• Skew &amp; Contrast</text>
    <text x="242" y="289" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e2e8f0">• Occlusion / Glare</text>

    <rect x="242" y="312" width="96" height="22" rx="4" fill="rgba(129,140,248,0.15)"/>
    <text x="290" y="326" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#818cf8" text-anchor="middle">ROUTER GATE</text>
  </g>

  <!-- STAGE 3: TRI-PATHWAY ADAPTIVE ROUTER (3 Branch Cards) -->
  <!-- 3A: Clean Route (x=420, y=145, w=135, h=60) -->
  <g filter="url(#boxDropShadow)">
    <rect x="420" y="145" width="135" height="60" rx="10" fill="url(#gradClean)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="434" cy="162" r="4" fill="#34d399"/>
    <text x="444" y="166" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34d399">CLEAN ROUTE</text>
    <text x="430" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#cbd5e1">Direct VLM Stream</text>
    <text x="430" y="196" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#86efac">Sub-Second Direct Pass</text>
  </g>

  <!-- 3B: Moderate Route (x=420, y=240, w=135, h=60) -->
  <g filter="url(#boxDropShadow)">
    <rect x="420" y="240" width="135" height="60" rx="10" fill="url(#gradMod)" stroke="#fbbf24" stroke-width="1.4"/>
    <circle cx="434" cy="257" r="4" fill="#fbbf24"/>
    <text x="444" y="261" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#fbbf24">MODERATE ROUTE</text>
    <text x="430" y="279" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#cbd5e1">Enhancement + VLM</text>
    <text x="430" y="291" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#fde68a">Wiener Deconvolution</text>
  </g>

  <!-- 3C: Severe Route (x=420, y=335, w=135, h=60) -->
  <g filter="url(#boxDropShadow)">
    <rect x="420" y="335" width="135" height="60" rx="10" fill="url(#gradSev)" stroke="#f43f5e" stroke-width="1.4"/>
    <circle cx="434" cy="352" r="4" fill="#f43f5e"/>
    <text x="444" y="356" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#f43f5e">SEVERE ROUTE</text>
    <text x="430" y="374" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#cbd5e1">OCR Fallback + VLM</text>
    <text x="430" y="386" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#fca5a5">PaddleOCR + Tesseract</text>
  </g>

  <!-- STAGE 4: MULTIMODAL CONTEXT PRUNING -->
  <!-- Box: x=620, y=190, w=130, h=160 -->
  <g filter="url(#boxDropShadow)">
    <rect x="620" y="190" width="130" height="160" rx="14" fill="url(#gradIngest)" stroke="rgba(56,189,248,0.6)" stroke-width="1.8" class="glowing-border"/>
    <circle cx="642" cy="216" r="8" fill="rgba(56,189,248,0.2)"/>
    <text x="639" y="220" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">4</text>
    <text x="656" y="219" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Context Pruning</text>

    <text x="632" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">BGE + FAISS Index</text>
    <text x="632" y="264" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34d399">-60% Pages Fed</text>
    <text x="632" y="280" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e2e8f0">(Top-2 Retrieved)</text>
    <text x="632" y="296" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">2.0x Fast Latency</text>

    <rect x="632" y="312" width="106" height="22" rx="4" fill="rgba(56,189,248,0.15)"/>
    <text x="685" y="326" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">3.75s RUNTIME</text>
  </g>

  <!-- STAGE 5: PHYSICAL VLM NEURAL ENGINE (RTX 3050 CUDA 12.6) -->
  <!-- Box: x=800, y=180, w=120, h=180 -->
  <g filter="url(#boxDropShadow)">
    <rect x="800" y="180" width="120" height="180" rx="16" fill="url(#gradCore)" stroke="rgba(129,140,248,0.7)" stroke-width="2" class="glowing-border"/>
    <rect x="812" y="195" width="96" height="22" rx="6" fill="rgba(0,0,0,0.5)"/>
    <text x="860" y="210" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#818cf8" text-anchor="middle">PHYSICAL CUDA</text>

    <text x="860" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">VLM Core</text>
    <text x="860" y="254" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">RTX 3050 (6GB)</text>
    
    <rect x="812" y="268" width="96" height="42" rx="6" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="860" y="284" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34d399" text-anchor="middle">INT4 NF4</text>
    <text x="860" y="298" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">531 MB VRAM</text>

    <text x="860" y="326" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8" text-anchor="middle">16.49 tok/s</text>
    <text x="860" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="middle">BitsAndBytes NF4</text>
  </g>

  <!-- STAGE 6: EVIDENCE GROUNDING & ABSTENTION GATE -->
  <!-- Box: x=970, y=190, w=105, h=160 -->
  <g filter="url(#boxDropShadow)">
    <rect x="970" y="190" width="105" height="160" rx="14" fill="url(#gradIngest)" stroke="rgba(52,211,153,0.5)" stroke-width="1.8" class="glowing-border"/>
    <circle cx="988" cy="216" r="8" fill="rgba(52,211,153,0.2)"/>
    <text x="985" y="220" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">6</text>
    <text x="1002" y="219" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Grounding</text>

    <text x="980" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94a3b8">BBox Regression</text>
    <text x="980" y="264" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34d399">IoU: 0.799</text>
    <text x="980" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94a3b8">Safety Gate</text>
    <text x="980" y="296" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#86efac">UAR: 1.09%</text>

    <rect x="980" y="312" width="85" height="22" rx="4" fill="rgba(52,211,153,0.15)"/>
    <text x="1022" y="326" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#34d399" text-anchor="middle">CALIBRATED</text>
  </g>

  <!-- ========================================================================= -->
  <!-- DUAL FINAL OUTPUTS                                                        -->
  <!-- ========================================================================= -->

  <!-- OUTPUT 1: VERIFIED ANSWER -->
  <!-- Box: x=1120, y=175, w=65, h=60 -->
  <g filter="url(#boxDropShadow)">
    <rect x="1120" y="175" width="65" height="60" rx="8" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="1134" cy="192" r="3.5" fill="#10b981"/>
    <text x="1142" y="195" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#10b981">VERIFIED</text>
    <text x="1152" y="214" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">89.1%</text>
    <text x="1152" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#cbd5e1" text-anchor="middle">SUC / EM</text>
  </g>

  <!-- OUTPUT 2: ABSTAIN / HUMAN REVIEW -->
  <!-- Box: x=1120, y=305, w=65, h=60 -->
  <g filter="url(#boxDropShadow)">
    <rect x="1120" y="305" width="65" height="60" rx="8" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="1.6"/>
    <circle cx="1134" cy="322" r="3.5" fill="#f43f5e"/>
    <text x="1142" y="325" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#f43f5e">ABSTAIN</text>
    <text x="1152" y="344" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#fca5a5" text-anchor="middle">Review</text>
    <text x="1152" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#cbd5e1" text-anchor="middle">Citations</text>
  </g>

  <!-- Bottom Architecture Metrics Footer -->
  <g transform="translate(60, 480)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">
      H14-3 (Retrieval Gain): +0.0836 EM (p=0.0002) · H14-4 (UAR Reduction): -0.2109 UAR (p&lt;0.0001) · Peak VRAM: 531 MB · RTX 3050 Physical CUDA 12.6
    </text>
  </g>
</svg>
