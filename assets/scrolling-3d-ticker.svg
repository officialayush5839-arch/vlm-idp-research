<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 68" width="100%" height="68">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <style>
      @keyframes tickerSlide {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-600px); }
      }
      .scrolling-track {
        animation: tickerSlide 14s linear infinite;
      }
      .scrolling-track:hover {
        animation-play-state: paused;
      }
    </style>
  </defs>

  <rect width="1200" height="68" fill="url(#tickerBg)" rx="12" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>

  <!-- Left/Right Fade Mask to give smooth infinite edge look -->
  <g class="scrolling-track">
    <!-- Sequence repeated twice for seamless loop -->
    <g id="tickerItems">
      <!-- Item 1 -->
      <g transform="translate(20, 18)">
        <rect width="170" height="32" rx="16" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">SUC: 89.1% SAFE</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(205, 18)">
        <rect width="175" height="32" rx="16" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#34d399"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">2.0X GPU SPEEDUP</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(395, 18)">
        <rect width="190" height="32" rx="16" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#818cf8"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#818cf8">INT4 NF4: 531 MB</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(600, 18)">
        <rect width="185" height="32" rx="16" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#f43f5e"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f43f5e">UAR: 1.1% (LOW)</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(800, 18)">
        <rect width="180" height="32" rx="16" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#fbbf24"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">BOOTSTRAP: p&lt;0.001</text>
      </g>
      <!-- Item 6 -->
      <g transform="translate(995, 18)">
        <rect width="185" height="32" rx="16" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
        <text x="28" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">TESTS: 439/439 PASS</text>
      </g>
    </g>

    <!-- Duplicate for seamless scroll -->
    <g transform="translate(1185, 0)">
      <use href="#tickerItems"/>
    </g>
  </g>

  <!-- Left and Right Gradient Overlay Fade to soften edges -->
  <rect x="0" y="0" width="80" height="68" fill="url(#leftFade)" rx="12"/>
  <rect x="1120" y="0" width="80" height="68" fill="url(#rightFade)" rx="12"/>

  <defs>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
