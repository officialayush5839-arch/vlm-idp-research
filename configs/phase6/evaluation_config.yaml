# Phase 6 Evaluation and Metrics Configuration
evaluation:
  cutoffs_k: [1, 3, 5, 10, 20]
  mrr_cutoff: 20
  ndcg_cutoff: 10
  bootstrap_replicates: 10000
  confidence_interval: 0.95
  metrics:
    - "recall_at_1"
    - "recall_at_3"
    - "recall_at_5"
    - "recall_at_10"
    - "recall_at_20"
    - "mrr"
    - "ndcg_at_10"
    - "page_recall"
    - "evidence_region_recall"
    - "vlm_page_reduction_ratio"
    - "retrieval_latency_ms"
