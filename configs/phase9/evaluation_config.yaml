# configs/phase9/evaluation_config.yaml
# Evaluation Metrics and Protocols

evaluation:
  split: "test"  # Benchmarking is strictly performed on test partition
  primary_metrics:
    - "selective_accuracy"
    - "selective_unsupported_rate"
    - "aurc"               # Area Under Risk-Coverage curve
    - "e_aurc"             # Excess Area Under Risk-Coverage curve
    - "coverage"           # Proportion of queries answered
    - "abstention_precision"
    - "abstention_recall"
    - "abstention_f1"
    - "expected_calibration_error"
    - "brier_score"

  risk_definition: "unsupported_or_incorrect"
  
  target_operating_coverages:
    - 1.00
    - 0.95
    - 0.90
    - 0.85
    - 0.80
    - 0.70
    - 0.60
    - 0.50

  statistical_testing:
    test_type: "paired_bootstrap"
    metric: "aurc"
    null_hypothesis: "AURC(Proposed) >= AURC(Baseline)"
    replications: 10000
    random_state: 42
    confidence_level: 0.95
