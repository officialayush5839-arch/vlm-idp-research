# Phase 8 Evaluation and Statistical Testing Configuration

version: "1.0.0"
phase: "PHASE_8"

metrics:
  calibration:
    - "expected_calibration_error"
    - "maximum_calibration_error"
    - "brier_score"
    - "negative_log_likelihood"
    - "calibration_slope"
    - "calibration_intercept"
  selective_prediction:
    - "coverage"
    - "selective_risk"
    - "selective_accuracy"
    - "error_rate_answered"
    - "abstention_rate"
    - "area_under_risk_coverage"
    - "excess_aurc"
    - "auroc_correctness"
    - "auprc_error_detection"

bootstrap_test:
  num_replicates: 10000
  confidence_level: 0.95
  random_seed: 42
  comparison_metric: "aurc"
