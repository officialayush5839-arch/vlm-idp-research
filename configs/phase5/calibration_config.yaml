# Post-Hoc Uncertainty Calibration Configuration — Phase 5
version: "1.0.0"
config_id: "phase5_calibration_config"
description: "Specification for post-hoc calibration architectures fitted strictly on Validation Partition"

methods:
  logistic:
    name: "Platt / Logistic Calibration"
    regularization: "l2"
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
  isotonic:
    name: "Isotonic Regression"
    out_of_bounds: "clip"
    increasing: true
  mlp:
    name: "Calibrated Lightweight Multi-Layer Perceptron"
    hidden_dim: 16
    dropout: 0.10
    learning_rate: 0.005
    max_epochs: 100

primary_calibrator: "logistic"

calibration_metrics:
  - "expected_calibration_error"  # ECE
  - "maximum_calibration_error"   # MCE
  - "brier_score"
  - "negative_log_likelihood"     # NLL

num_bins: 10
frozen_partition: "val"
zero_leakage_enforced: true
