# OCR Configuration - Phase 2 Baseline Freeze
primary_engine: "paddleocr"
secondary_engine: "tesseract"

paddleocr:
  use_angle_cls: true
  lang: "en"
  use_gpu: false
  show_log: false
  det_model_dir: null
  rec_model_dir: null
  cls_model_dir: null
  det_limit_side_len: 960
  det_db_thresh: 0.3
  det_db_box_thresh: 0.6
  det_db_unclip_ratio: 1.5

tesseract:
  lang: "eng"
  psm: 3
  oem: 3
  timeout_seconds: 30

normalization:
  target_coordinate_space: [0, 1000]
  confidence_threshold: 0.10
  preserve_raw_boxes: true
