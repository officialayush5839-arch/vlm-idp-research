# configs/phase10_5/preprocessing_config.yaml
# Strategy A: Observable Visual Preprocessing and Image Restoration

preprocessing:
  enabled: true
  methods:
    - contrast_normalization
    - unsharp_masking
    - adaptive_thresholding
  parameters:
    contrast:
      alpha: 1.25
      beta: 10
    sharpening:
      kernel_size: 3
      sigma: 1.0
      amount: 1.5
    thresholding:
      block_size: 11
      c: 2
  target_domains:
    - D2_visual_style_shift
    - D4_combined_shift
  min_quality_boost_expected: 0.15
